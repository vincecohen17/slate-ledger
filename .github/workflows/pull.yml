name: pull-odds
on:
  workflow_dispatch:
    inputs:
      mode: { description: "auto, refresh, live, rebuild, stats", default: "auto" }
  push:
    branches: [main]
    paths: ["engine/run-request"]
  schedule:
    # app-driven refresh: every 5 minutes the engine checks whether the site is open and what is stale
    - cron: "*/5 * * * *"
# in-play pulls run in their own lane so a long pre-game pull never holds them up
concurrency: { group: "pull-${{ (github.event.inputs.mode == 'live' || github.event.inputs.mode == 'history' || github.event.inputs.mode == 'backtest') && github.event.inputs.mode || 'main' }}", cancel-in-progress: false }
permissions:
  contents: read
  actions: write        # a long history backfill asks for its next run
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: vincecohen17/slate-ledger-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q firebase-admin openpyxl
      - name: Engine self-test
        run: python engine/tests/test_build.py
      - name: Pull, build, publish
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GITHUB_TOKEN: ${{ github.token }}
          DATA_DIR: data
          MODE: ${{ github.event.inputs.mode || (github.event_name == 'schedule' && 'auto') || '' }}
        run: python engine/run.py
      - name: Save snapshot to the private data repo
        if: always()
        run: |
          cd data
          git config user.name "slate-ledger-bot"
          git config user.email "slate-ledger-bot@users.noreply.github.com"
          git add -A
          git commit -qm "snapshot $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 3; done
