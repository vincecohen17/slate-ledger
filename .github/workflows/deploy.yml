name: deploy-site
on:
  push:
    branches: [main]
    paths: ["site/**", "firebase.json", "firestore.rules.template", "database.rules.template.json", ".github/workflows/deploy.yml"]
  workflow_dispatch:
concurrency: { group: deploy, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: vincecohen17/slate-ledger-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data
          sparse-checkout: config
      - name: Build rules from private config
        run: |
          python3 -c "import json;e=json.load(open('data/config/access.json'))['email'];open('firestore.rules','w').write(open('firestore.rules.template').read().replace('__ALLOWED_EMAIL__',e))"
          python3 -c "import json;e=json.load(open('data/config/access.json'))['email'];open('database.rules.json','w').write(open('database.rules.template.json').read().replace('__ALLOWED_EMAIL__',e))"
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Check every site module parses (a syntax error would blank the whole site)
        run: |
          for f in $(find site/js -name '*.js'); do cp "$f" "$RUNNER_TEMP/m.mjs"; node --check "$RUNNER_TEMP/m.mjs" || { echo "syntax error in $f"; exit 1; }; done
      - name: Credentials
        env: { SA: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" }
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - name: Deploy hosting and rules
        run: npx -y firebase-tools@13 deploy --only hosting,firestore:rules --project slate-ledger --non-interactive
      - name: Realtime Database rules (once the database exists)
        continue-on-error: true
        run: npx -y firebase-tools@13 deploy --only database --project slate-ledger --non-interactive
      - name: Clean up
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
